<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💌 Send Something Cute</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Sacramento&family=Caveat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script

      src="https://www.googletagmanager.com/gtag/js?id=G-NHZ2WTB36C"
    ></script>
    <script>

    <style>
      :root {
        --pink-100: #fff0f5;
        --pink-200: #ffd6e7;
        --pink-300: #ffb3d1;
        --pink-400: #ff80b5;
        --pink-500: #ff4d94;
        --pink-600: #e6005c;
        --lavender: #e8d5f5;
        --peach: #ffe5d9;
        --mint: #d5f5e3;
        --warm-white: #fffaf5;
        --text-dark: #4a2040;
        --text-medium: #7a4068;
        --text-light: #a06080;
        --shadow-soft: 0 4px 20px rgba(255, 77, 148, 0.15);
        --shadow-glow: 0 0 30px rgba(255, 77, 148, 0.2);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Quicksand", sans-serif;
        background: var(--warm-white);
        color: var(--text-dark);
        overflow-x: hidden;
        min-height: 100vh;
      }
      .bg-hearts {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }
      .bg-hearts .heart {
        position: absolute;
        font-size: 20px;
        opacity: 0;
        animation: floatUp linear infinite;
      }
      @keyframes floatUp {
        0% {
          transform: translateY(100vh) rotate(0deg) scale(0.5);
          opacity: 0;
        }
        10% {
          opacity: 0.6;
        }
        90% {
          opacity: 0.3;
        }
        100% {
          transform: translateY(-10vh) rotate(360deg) scale(1);
          opacity: 0;
        }
      }
      .sparkle-field {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }
      .sparkle {
        position: absolute;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--pink-400);
        opacity: 0;
        animation: twinkle 3s ease-in-out infinite;
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0;
          transform: scale(0.5);
        }
        50% {
          opacity: 0.8;
          transform: scale(1.2);
        }
      }
      .landing {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 40px 20px 60px;
        background:
          radial-gradient(
            ellipse at 20% 50%,
            rgba(255, 179, 209, 0.25) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse at 80% 20%,
            rgba(232, 213, 245, 0.3) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse at 50% 80%,
            rgba(255, 229, 217, 0.25) 0%,
            transparent 50%
          ),
          var(--warm-white);
      }
      .landing-title {
        font-family: "Sacramento", cursive;
        font-size: clamp(48px, 10vw, 90px);
        color: var(--pink-500);
        text-align: center;
        margin-bottom: 8px;
        text-shadow: 2px 2px 10px rgba(255, 77, 148, 0.2);
        animation: fadeInDown 1s ease;
      }
      .landing-sub {
        font-size: clamp(14px, 2.5vw, 18px);
        color: var(--text-light);
        text-align: center;
        margin-bottom: 28px;
        font-weight: 500;
        animation: fadeInDown 1s ease 0.2s both;
      }
      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .name-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 36px;
        animation: fadeInDown 1s ease 0.3s both;
      }
      .name-label {
        font-family: "Caveat", cursive;
        font-size: 22px;
        color: var(--text-medium);
        margin-bottom: 10px;
      }
      .name-input {
        padding: 12px 22px;
        border: 2.5px solid var(--pink-300);
        border-radius: 50px;
        font-family: "Quicksand", sans-serif;
        font-size: 16px;
        font-weight: 600;
        color: var(--text-dark);
        background: white;
        outline: none;
        width: 280px;
        max-width: 80vw;
        text-align: center;
        transition: all 0.3s;
        box-shadow: 0 2px 12px rgba(255, 77, 148, 0.08);
      }
      .name-input::placeholder {
        color: var(--pink-300);
        font-weight: 500;
      }
      .name-input:focus {
        border-color: var(--pink-500);
        box-shadow:
          0 0 0 4px rgba(255, 77, 148, 0.12),
          0 2px 12px rgba(255, 77, 148, 0.15);
      }
      .name-input.shake {
        animation: shakeInput 0.5s ease;
        border-color: var(--pink-600);
      }
      @keyframes shakeInput {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-8px);
        }
        40% {
          transform: translateX(8px);
        }
        60% {
          transform: translateX(-6px);
        }
        80% {
          transform: translateX(6px);
        }
      }
      .name-hint {
        font-size: 12px;
        color: var(--pink-500);
        margin-top: 8px;
        height: 16px;
        opacity: 0;
        transition: opacity 0.3s;
        font-weight: 600;
      }
      .name-hint.show {
        opacity: 1;
      }
      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 20px;
        max-width: 960px;
        width: 100%;
        padding: 0 20px;
        animation: fadeIn 1s ease 0.4s both;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .msg-card {
        background: white;
        border-radius: 20px;
        padding: 28px 24px;
        text-align: center;
        cursor: pointer;
        border: 2px solid transparent;
        box-shadow: var(--shadow-soft);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
      }
      .msg-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(255, 179, 209, 0.1),
          rgba(232, 213, 245, 0.1)
        );
        opacity: 0;
        transition: opacity 0.3s;
      }
      .msg-card:hover {
        transform: translateY(-4px);
        border-color: var(--pink-300);
        box-shadow: var(--shadow-glow);
      }
      .msg-card:hover::before {
        opacity: 1;
      }
      .card-emoji {
        font-size: 44px;
        display: block;
        margin-bottom: 14px;
        transition: transform 0.3s;
      }
      .msg-card:hover .card-emoji {
        transform: scale(1.15) rotate(-5deg);
      }
      .card-title {
        font-family: "Caveat", cursive;
        font-size: 22px;
        font-weight: 700;
        color: var(--text-dark);
        line-height: 1.3;
      }
      .card-tag {
        display: inline-block;
        margin-top: 10px;
        padding: 3px 12px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .tag-love {
        background: var(--pink-200);
        color: var(--pink-600);
      }
      .tag-sorry {
        background: var(--lavender);
        color: #6b3fa0;
      }
      .tag-flirty {
        background: var(--peach);
        color: #c45e2c;
      }
      .tag-funny {
        background: var(--mint);
        color: #2e7d52;
      }
      .tag-sweet {
        background: #fce4ec;
        color: #c62828;
      }
      .question-page {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 30px;
        text-align: center;
        overflow: hidden;
      }
      .question-page.active {
        display: flex;
        animation: pageIn 0.5s ease;
      }
      @keyframes pageIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .q-bg {
        position: absolute;
        inset: 0;
        z-index: -1;
      }
      .q-back-btn {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.7);
        border: none;
        border-radius: 50%;
        width: 44px;
        height: 44px;
        font-size: 20px;
        cursor: pointer;
        backdrop-filter: blur(10px);
        transition: all 0.2s;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .q-back-btn:hover {
        background: white;
        transform: scale(1.1);
      }
      .question-page.receiver-mode .q-back-btn {
        display: none;
      }
      .q-name-greeting {
        font-family: "Sacramento", cursive;
        font-size: clamp(28px, 6vw, 44px);
        color: var(--pink-500);
        margin-bottom: 4px;
        opacity: 0.9;
        animation: fadeInDown 0.5s ease 0.1s both;
      }
      .q-emoji {
        font-size: clamp(60px, 15vw, 100px);
        margin-bottom: 20px;
        animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      }
      @keyframes bounceIn {
        0% {
          transform: scale(0);
        }
        60% {
          transform: scale(1.15);
        }
        100% {
          transform: scale(1);
        }
      }
      .q-text {
        font-family: "Caveat", cursive;
        font-size: clamp(32px, 7vw, 56px);
        font-weight: 700;
        color: var(--text-dark);
        max-width: 600px;
        line-height: 1.2;
        margin-bottom: 10px;
        animation: fadeInDown 0.6s ease 0.2s both;
      }
      .q-subtext {
        font-size: clamp(13px, 2vw, 16px);
        color: var(--text-light);
        margin-bottom: 36px;
        font-weight: 500;
        font-style: italic;
        animation: fadeInDown 0.6s ease 0.3s both;
      }
      .btn-row {
        display: flex;
        gap: 20px;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        animation: fadeIn 0.6s ease 0.4s both;
        min-height: 70px;
        position: relative;
      }
      .btn-primary {
        padding: 14px 48px;
        border: none;
        border-radius: 50px;
        font-family: "Quicksand", sans-serif;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        letter-spacing: 0.5px;
        position: relative;
        overflow: hidden;
        color: white;
      }
      .btn-primary::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.3),
          transparent
        );
        pointer-events: none;
      }
      .btn-primary:hover {
        transform: scale(1.08);
        box-shadow: 0 6px 25px rgba(255, 77, 148, 0.35);
      }
      .btn-primary:active {
        transform: scale(1.02);
      }
      .btn-dodge {
        padding: 14px 48px;
        border: 2px solid var(--pink-300);
        border-radius: 50px;
        background: white;
        font-family: "Quicksand", sans-serif;
        font-size: 18px;
        font-weight: 700;
        color: var(--text-medium);
        cursor: pointer;
        transition: all 0.15s ease;
        user-select: none;
        position: relative;
      }
      .yes-response {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 20;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 30px;
        text-align: center;
        background:
          radial-gradient(
            ellipse at center,
            rgba(255, 179, 209, 0.3) 0%,
            transparent 70%
          ),
          var(--warm-white);
      }
      .yes-response.active {
        display: flex;
        animation: pageIn 0.5s ease;
      }
      .yes-emoji {
        font-size: 80px;
        animation: heartBeat 1s ease infinite;
      }
      @keyframes heartBeat {
        0%,
        100% {
          transform: scale(1);
        }
        15% {
          transform: scale(1.15);
        }
        30% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.1);
        }
      }
      .yes-text {
        font-family: "Sacramento", cursive;
        font-size: clamp(36px, 8vw, 64px);
        color: var(--pink-500);
        margin: 20px 0 10px;
      }
      .yes-sub {
        font-size: 18px;
        color: var(--text-medium);
        font-weight: 500;
      }
      .yes-response .btn-back-home {
        margin-top: 30px;
        padding: 12px 32px;
        border: 2px solid var(--pink-300);
        border-radius: 50px;
        background: white;
        font-family: "Quicksand", sans-serif;
        font-size: 15px;
        font-weight: 600;
        color: var(--text-medium);
        cursor: pointer;
        transition: all 0.2s;
      }
      .yes-response .btn-back-home:hover {
        background: var(--pink-100);
      }
      .confetti-container {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 25;
        overflow: hidden;
      }
      .confetti-piece {
        position: absolute;
        top: -20px;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        animation: confettiFall linear forwards;
      }
      @keyframes confettiFall {
        0% {
          transform: translateY(0) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translateY(100vh) rotate(720deg);
          opacity: 0;
        }
      }
      .chaos-msg {
        position: absolute;
        z-index: 15;
        font-family: "Caveat", cursive;
        font-size: 20px;
        font-weight: 700;
        color: var(--pink-500);
        pointer-events: none;
        max-width: 70vw;
        text-align: center;
        padding: 6px 14px;
        background: rgba(255, 255, 255, 0.75);
        border-radius: 20px;
        backdrop-filter: blur(4px);
        box-shadow: 0 2px 12px rgba(255, 77, 148, 0.15);
        animation: popFade 3.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      @keyframes popFade {
        0% {
          opacity: 0;
          transform: scale(0.3);
        }
        8% {
          opacity: 1;
          transform: scale(1.05);
        }
        15% {
          transform: scale(1);
        }
        70% {
          opacity: 1;
          transform: scale(1) translateY(-8px);
        }
        100% {
          opacity: 0;
          transform: scale(0.9) translateY(-30px);
        }
      }
      .share-bar {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        border: 2px solid var(--pink-200);
        border-radius: 16px;
        padding: 10px 14px;
        box-shadow: 0 4px 20px rgba(255, 77, 148, 0.1);
        z-index: 12;
        max-width: 92vw;
        animation: fadeIn 0.6s ease 0.6s both;
      }
      .share-bar-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-light);
        white-space: nowrap;
      }
      .share-bar input {
        width: 240px;
        max-width: 45vw;
        padding: 8px 12px;
        border: 1.5px solid var(--pink-200);
        border-radius: 10px;
        font-family: "Quicksand", sans-serif;
        font-size: 12px;
        color: var(--text-medium);
        background: var(--pink-100);
        outline: none;
        text-overflow: ellipsis;
      }
      .share-bar input:focus {
        border-color: var(--pink-400);
      }
      .copy-btn {
        background: var(--pink-500);
        border: none;
        border-radius: 10px;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.25s;
        flex-shrink: 0;
        position: relative;
      }
      .copy-btn:hover {
        background: var(--pink-600);
        transform: scale(1.08);
      }
      .copy-btn:active {
        transform: scale(0.95);
      }
      .copy-btn svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: white;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: all 0.25s;
      }
      .copy-btn.copied {
        background: #27ae60;
      }
      .copy-btn.copied .icon-copy {
        opacity: 0;
        transform: scale(0.5);
      }
      .copy-btn .icon-check {
        position: absolute;
        opacity: 0;
        transform: scale(0.5);
        transition: all 0.25s;
      }
      .copy-btn.copied .icon-check {
        opacity: 1;
        transform: scale(1);
      }
      .question-page.receiver-mode .share-bar {
        display: none;
      }
      .bell-btn {
        background: #6c5ce7;
      }
      .bell-btn:hover {
        background: #5a4bd1;
      }
      .bell-btn svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: white;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .copy-toast {
        position: fixed;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--text-dark);
        color: white;
        padding: 10px 24px;
        border-radius: 50px;
        font-size: 14px;
        font-weight: 600;
        z-index: 35;
        animation: toastIn 2.2s ease forwards;
        white-space: nowrap;
      }
      @keyframes toastIn {
        0% {
          opacity: 0;
          transform: translateX(-50%) translateY(10px);
        }
        15%,
        70% {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
        100% {
          opacity: 0;
          transform: translateX(-50%) translateY(-10px);
        }
      }
      .footer {
        text-align: center;
        padding: 40px 20px 30px;
        color: var(--text-light);
        font-size: 13px;
        position: relative;
        z-index: 1;
      }
      .footer span {
        color: var(--pink-400);
      }
      @media (max-width: 600px) {
        .card-grid {
          grid-template-columns: 1fr 1fr;
          gap: 14px;
        }
        .msg-card {
          padding: 20px 16px;
        }
        .card-emoji {
          font-size: 34px;
          margin-bottom: 10px;
        }
        .card-title {
          font-size: 18px;
        }
        .name-input {
          width: 240px;
          font-size: 15px;
          padding: 11px 18px;
        }
        .name-label {
          font-size: 20px;
        }
        .question-page {
          padding: 20px 16px;
        }
        .q-back-btn {
          width: 38px;
          height: 38px;
          font-size: 18px;
          top: 14px;
          left: 14px;
        }
        .q-name-greeting {
          font-size: clamp(24px, 5.5vw, 36px);
          margin-bottom: 2px;
        }
        .q-emoji {
          font-size: clamp(50px, 14vw, 80px);
          margin-bottom: 14px;
        }
        .q-text {
          font-size: clamp(26px, 6.5vw, 44px);
          margin-bottom: 6px;
          padding: 0 8px;
        }
        .q-subtext {
          font-size: 13px;
          margin-bottom: 24px;
          padding: 0 12px;
        }
        .btn-row {
          gap: 14px;
          min-height: 56px;
        }
        .btn-primary {
          padding: 12px 36px;
          font-size: 16px;
        }
        .btn-dodge {
          padding: 12px 36px;
          font-size: 16px;
        }
        .chaos-msg {
          font-size: 17px;
          max-width: 80vw;
          padding: 5px 12px;
        }
        .share-bar {
          flex-wrap: wrap;
          justify-content: center;
          padding: 8px 10px;
          bottom: 10px;
          gap: 6px;
          border-radius: 12px;
          max-width: 95vw;
        }
        .share-bar input {
          width: 160px;
          max-width: 52vw;
          font-size: 11px;
          padding: 7px 10px;
        }
        .share-bar-label {
          display: none;
        }
        .copy-btn {
          width: 36px;
          height: 36px;
        }
        .copy-btn svg {
          width: 16px;
          height: 16px;
        }
      }
      @media (max-width: 380px) {
        .card-grid {
          grid-template-columns: 1fr;
        }
        .question-page {
          padding: 16px 12px;
        }
        .q-emoji {
          font-size: 50px;
          margin-bottom: 10px;
        }
        .q-text {
          font-size: 24px;
        }
        .btn-primary,
        .btn-dodge {
          padding: 10px 28px;
          font-size: 15px;
        }
        .share-bar {

        btn.style.transform = `scale(${Math.max(0.4, 1 - dodgeCount[id] * 0.06)})`;
        btn.style.opacity = Math.max(0.3, 1 - dodgeCount[id] * 0.07);
        const dc = dodgeCount[id];
        if ([3, 5, 8].includes(dc)) {
          const unwanted = m.wantYes !== false ? "No" : "Yes";
          ntfySend(
            currentTopic,
            "😂 Dodge x" + dc,
            (currentName || "They") +
              ' tried to hit "' +
              unwanted +
              '" ' +
              dc +
              ' times on: "' +
              m.title +
              '"',
            "laughing",
          );
        }
        const pool = dodgePools[id];
        if (pool.length) {
          const i = Math.floor(Math.random() * pool.length);
          const txt = pool.splice(i, 1)[0];
          const el = document.createElement("div");
          el.className = "chaos-msg";
          el.textContent = txt;
          const pw = page.clientWidth,
            ph = page.clientHeight;
          const safeX = Math.max(
            20,
            Math.min(pw - 200, Math.random() * (pw - 100)),
          );
          const safeY = Math.max(
            60,
            Math.min(ph - 120, 80 + Math.random() * (ph - 240)),
          );
          el.style.left = safeX + "px";
          el.style.top = safeY + "px";
          page.appendChild(el);
          setTimeout(() => el.remove(), 3800);
        }
        const labels = m.dodgeLabels;
        btn.textContent = labels[Math.min(dodgeCount[id], labels.length - 1)];
      }
      function launchConfetti() {
        const c = document.getElementById("confettiContainer");
        c.innerHTML = "";
        const cols = [
          "#ff4d94",
          "#ff80b5",
          "#ffb3d1",
          "#e8d5f5",
          "#ffe5d9",
          "#ffd6e7",
          "#f39c12",
          "#e74c3c",
          "#9b59b6",
          "#3498db",
        ];
        for (let i = 0; i < 80; i++) {
          const p = document.createElement("div");
          p.className = "confetti-piece";
          p.style.left = Math.random() * 100 + "%";
          p.style.background = cols[Math.floor(Math.random() * cols.length)];
          p.style.animationDuration = Math.random() * 2 + 1.5 + "s";
          p.style.animationDelay = Math.random() * 0.8 + "s";
          p.style.width = Math.random() * 8 + 6 + "px";
          p.style.height = Math.random() * 8 + 6 + "px";
          p.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
          c.appendChild(p);
        }
      }
      function copyLink(id) {
        const inp = document.getElementById(`shareIn-${id}`);
        const btn = document.getElementById(`copyBtn-${id}`);
        navigator.clipboard.writeText(inp.value).then(() => {
          btn.classList.add("copied");
          if (typeof gtag === "function")
            gtag("event", "link_copied", { question: id });
          const t = document.createElement("div");
          t.className = "copy-toast";
          t.textContent = "Copied! Now send it to bae 💌";
          document.body.appendChild(t);
          setTimeout(() => t.remove(), 2400);
          setTimeout(() => btn.classList.remove("copied"), 2000);
        });
      }
      function subscribeTopic(id) {
        if (!currentTopic) return;
        window.open("https://ntfy.sh/" + currentTopic, "_blank");
        const t = document.createElement("div");
        t.className = "copy-toast";
        t.textContent = "🔔 Subscribe there to get notified!";
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2800);
      }
      function checkHash() {
        const h = location.hash.slice(1);
        if (!h || !h.includes(".")) return;
        const parts = h.split(".");
        if (parts.length < 2) return;
        const code = parts[0];
        const qId = Q_CODES[code];
        if (!qId || !messages.find((m) => m.id === qId)) return;
        const name = decodeName(parts[1] || "");
        currentTopic = parts[2] || "";
        currentName = name;
        openQ(qId, name, true);
        const m = messages.find((x) => x.id === qId);
        ntfySend(
          currentTopic,
          "👀 Link Opened!",
          (name || "Someone") + ' just opened: "' + m.title + '"',
          "eyes",
        );
        if (typeof gtag === "function")
          gtag("event", "link_opened", { question: qId, has_name: !!name });
      }
      window.addEventListener("load", checkHash);
      const hearts = ["💕", "💗", "💖", "💓", "💝", "🩷", "♡", "❤️‍🔥", "💘"];
      const bh = document.getElementById("bgHearts");
      for (let i = 0; i < 20; i++) {
        const h = document.createElement("div");
        h.className = "heart";
        h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        h.style.left = Math.random() * 100 + "%";
        h.style.animationDuration = Math.random() * 8 + 6 + "s";
        h.style.animationDelay = Math.random() * 10 + "s";
        h.style.fontSize = Math.random() * 16 + 14 + "px";
        bh.appendChild(h);
      }
      const sf = document.getElementById("sparkleField");
      for (let i = 0; i < 30; i++) {
        const s = document.createElement("div");
        s.className = "sparkle";
        s.style.left = Math.random() * 100 + "%";
        s.style.top = Math.random() * 100 + "%";
        s.style.animationDelay = Math.random() * 5 + "s";
        s.style.background = [
          "#ff4d94",
          "#9b59b6",
          "#e74c3c",
          "#f39c12",
          "#ff80b5",
        ][Math.floor(Math.random() * 5)];
        sf.appendChild(s);
      }
      document
        .getElementById("nameInput")
        .addEventListener("input", function () {
          if (this.value.trim())
            document.getElementById("nameHint").classList.remove("show");
        });
    </script>
  </body>
</html>
