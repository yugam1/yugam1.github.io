<svg width="180" height="180" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradYP" x1="0" y1="0" x2="160" y2="160">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="160" height="160" rx="40" fill="#0a0a0f"/>

  <!-- Perfectly centered circular badge -->
  <circle cx="80" cy="80" r="56"
          stroke="url(#gradYP)"
          stroke-width="3"
          opacity="0.6"/>

  <!-- Group centered around middle -->
  <g transform="translate(0,2)">
    
    <!-- Y (left, balanced) -->
    <path d="M50 52 L70 75 L90 52 M70 75 L70 105"
          stroke="url(#gradYP)"
          stroke-width="7"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- P (right, equal spacing from Y) -->
    <path d="M90 52 L90 105 M90 52 
             Q115 52 115 70 
             Q115 88 90 88"
          stroke="url(#gradYP)"
          stroke-width="7"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>