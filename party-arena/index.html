<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Party Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Righteous&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg-deep: #0a0e1a;
        --bg-surface: #111827;
        --bg-card: rgba(255, 255, 255, 0.04);
        --bg-glass: rgba(255, 255, 255, 0.06);
        --border-subtle: rgba(255, 255, 255, 0.08);
        --border-glow: rgba(251, 191, 36, 0.3);
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --accent: #fbbf24;
        --accent-soft: rgba(251, 191, 36, 0.15);
        --accent-hot: #f59e0b;
        --success: #34d399;
        --danger: #f87171;
        --info: #60a5fa;
        --radius: 16px;
        --radius-sm: 10px;
        --radius-pill: 50px;
        --shadow-glow: 0 0 30px rgba(251, 191, 36, 0.08);
        --font-body: "Quicksand", sans-serif;
        --font-display: "Righteous", cursive;
        --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      html,
      body {
        height: 100%;
        width: 100%;
        font-family: var(--font-body);
        background: var(--bg-deep);
        color: var(--text-primary);
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        display: flex;
        flex-direction: column;
        background-image:
          radial-gradient(
            ellipse at 20% 0%,
            rgba(251, 191, 36, 0.06) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse at 80% 100%,
            rgba(99, 102, 241, 0.06) 0%,
            transparent 50%
          );
      }

      /* ─── Utility ─── */
      .hidden {
        display: none !important;
      }
      .fade-in {
        animation: fadeIn 0.4s ease both;
      }
      .slide-up {
        animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes pulse-soft {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.6;
        }
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ─── Screen Container ─── */
      .screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        overflow-y: auto;
        transition:
          opacity 0.35s,
          transform 0.35s;
      }
      .screen.out {
        opacity: 0;
        transform: translateY(-20px);
        pointer-events: none;
      }

      /* ─── Game Screen: override .screen to be true flex column ─── */
      #screen-game {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 36px; /* leave room for status-bar */
        padding: 0;
        overflow: hidden;
        align-items: stretch;
        display: flex;
        flex-direction: column;
      }

      /* ─── Logo / Header ─── */
      .logo {
        font-family: var(--font-display);
        font-size: clamp(2rem, 6vw, 3.2rem);
        color: var(--accent);
        text-shadow: 0 0 40px rgba(251, 191, 36, 0.3);
        letter-spacing: 2px;
        margin: 12vh 0 8px;
      }
      .logo-sub {
        color: var(--text-secondary);
        font-size: 0.95rem;
        font-weight: 500;
        margin-bottom: 40px;
        letter-spacing: 0.5px;
      }

      /* ─── Cards ─── */
      .card {
        background: var(--bg-glass);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius);
        padding: 24px;
        width: 100%;
        max-width: 420px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .card + .card {
        margin-top: 14px;
      }
      .card-title {
        font-family: var(--font-display);
        font-size: 1.15rem;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .card-title .emoji {
        font-size: 1.4rem;
      }

      /* ─── Inputs ─── */
      input[type="text"] {
        width: 100%;
        background: rgba(0, 0, 0, 0.3);
        border: 1.5px solid var(--border-subtle);
        border-radius: var(--radius-sm);
        padding: 14px 16px;
        color: var(--text-primary);
        font-family: var(--font-body);
        font-size: 1rem;
        font-weight: 600;
        outline: none;
        transition: border-color var(--transition);
      }
      input[type="text"]:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      input[type="text"]::placeholder {
        color: var(--text-muted);
        font-weight: 400;
      }
      .input-row {
        display: flex;
        gap: 10px;
        margin-top: 12px;
      }
      .input-row input {
        flex: 1;
      }

      /* ─── Buttons ─── */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 14px 28px;
        border: none;
        border-radius: var(--radius-sm);
        font-family: var(--font-body);
        font-weight: 700;
        font-size: 0.95rem;
        cursor: pointer;
        transition: all var(--transition);
        white-space: nowrap;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
      }
      .btn-primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-hot));
        color: #0a0e1a;
        box-shadow: 0 4px 20px rgba(251, 191, 36, 0.25);
      }
      .btn-primary:hover:not(:disabled) {
        box-shadow: 0 6px 28px rgba(251, 191, 36, 0.35);
        transform: translateY(-1px);
      }
      .btn-secondary {
        background: var(--bg-glass);
        color: var(--text-primary);
        border: 1.5px solid var(--border-subtle);
      }
      .btn-secondary:hover:not(:disabled) {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .btn-danger {
        background: rgba(248, 113, 113, 0.15);
        color: var(--danger);
        border: 1.5px solid rgba(248, 113, 113, 0.2);
      }
      .btn-sm {
        padding: 10px 18px;
        font-size: 0.85rem;
      }
      .btn-block {
        width: 100%;
        margin-top: 12px;
      }
      .btn-icon {
        width: 44px;
        height: 44px;
        padding: 0;
        border-radius: 50%;
        font-size: 1.2rem;
      }

      /* ─── Name Input Screen ─── */
      .name-input-wrap {
        width: 100%;
        max-width: 420px;
        margin-bottom: 20px;
      }
      .name-input-wrap input {
        text-align: center;
        font-size: 1.1rem;
        letter-spacing: 1px;
      }

      /* ─── Room Code ─── */
      .room-code {
        font-family: var(--font-display);
        font-size: clamp(2.5rem, 10vw, 4rem);
        color: var(--accent);
        letter-spacing: 8px;
        text-shadow: 0 0 30px rgba(251, 191, 36, 0.4);
        cursor: pointer;
        transition: transform 0.2s;
        user-select: all;
      }
      .room-code:hover {
        transform: scale(1.04);
      }
      .room-code-label {
        font-size: 0.8rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 6px;
      }
      .copied-toast {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--success);
        color: #000;
        padding: 10px 24px;
        border-radius: var(--radius-pill);
        font-weight: 700;
        font-size: 0.85rem;
        z-index: 999;
        animation:
          slideUp 0.3s ease,
          fadeOut 0.3s 1.5s ease both;
      }
      @keyframes fadeOut {
        to {
          opacity: 0;
          transform: translateY(-10px);
        }
      }

      /* ─── Player List ─── */
      .player-list {
        list-style: none;
        width: 100%;
        max-width: 420px;
        margin: 16px 0;
      }
      .player-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        background: var(--bg-card);
        margin-bottom: 8px;
        animation: slideUp 0.4s ease both;
      }
      .player-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        font-weight: 700;
        flex-shrink: 0;
      }
      .player-name {
        font-weight: 600;
        flex: 1;
      }
      .player-badge {
        font-size: 0.7rem;
        padding: 3px 10px;
        border-radius: var(--radius-pill);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .badge-host {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .badge-you {
        background: rgba(96, 165, 250, 0.15);
        color: var(--info);
      }
      .btn-kick {
        width: 32px;
        height: 32px;
        padding: 0;
        border-radius: 50%;
        background: rgba(248, 113, 113, 0.1);
        border: 1.5px solid rgba(248, 113, 113, 0.15);
        color: var(--danger);
        font-size: 0.85rem;
        cursor: pointer;
        transition: all var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        opacity: 0.6;
      }
      .btn-kick:hover {
        opacity: 1;
        background: rgba(248, 113, 113, 0.2);
        border-color: var(--danger);
        transform: scale(1.1);
      }

      /* ─── Kick Confirm Modal ─── */
      .kick-modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        animation: fadeIn 0.2s ease;
        backdrop-filter: blur(4px);
      }
      .kick-modal {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius);
        padding: 28px;
        max-width: 340px;
        width: 90%;
        text-align: center;
        animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .kick-modal h3 {
        font-family: var(--font-display);
        margin-bottom: 8px;
        font-size: 1.1rem;
      }
      .kick-modal p {
        color: var(--text-secondary);
        font-size: 0.9rem;
        margin-bottom: 20px;
      }
      .kick-modal-btns {
        display: flex;
        gap: 10px;
      }
      .kick-modal-btns .btn {
        flex: 1;
      }

      /* ─── Kicked Banner ─── */
      .kicked-banner {
        background: rgba(248, 113, 113, 0.12);
        border: 1px solid rgba(248, 113, 113, 0.2);
        border-radius: var(--radius-sm);
        padding: 14px 18px;
        margin-bottom: 16px;
        text-align: center;
        color: var(--danger);
        font-weight: 600;
        font-size: 0.9rem;
        animation: slideUp 0.4s ease;
        max-width: 420px;
        width: 100%;
      }

      /* ─── Game Picker ─── */
      .game-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
        width: 100%;
        max-width: 420px;
        margin: 16px 0;
      }
      .game-card {
        background: var(--bg-glass);
        border: 2px solid var(--border-subtle);
        border-radius: var(--radius);
        padding: 20px;
        cursor: pointer;
        transition: all var(--transition);
        text-align: left;
      }
      .game-card:hover,
      .game-card.selected {
        border-color: var(--accent);
        background: var(--accent-soft);
        box-shadow: var(--shadow-glow);
      }
      .game-card .emoji {
        font-size: 2rem;
        margin-bottom: 8px;
        display: block;
      }
      .game-card h3 {
        font-family: var(--font-display);
        font-size: 1.1rem;
        margin-bottom: 4px;
      }
      .game-card p {
        font-size: 0.85rem;
        color: var(--text-secondary);
        line-height: 1.4;
      }
      .game-card .meta {
        margin-top: 8px;
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      /* ─── Lobby Header ─── */
      .lobby-header {
        text-align: center;
        width: 100%;
        max-width: 420px;
        padding: 20px 0;
      }
      .lobby-header h2 {
        font-family: var(--font-display);
        font-size: 1.4rem;
        margin-bottom: 12px;
      }

      /* ─── Section Titles ─── */
      .section-title {
        font-family: var(--font-display);
        font-size: 1rem;
        color: var(--text-secondary);
        text-align: left;
        width: 100%;
        max-width: 420px;
        margin: 20px 0 6px;
        letter-spacing: 1px;
      }

      /* ─── Game Container ─── */
      #game-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        min-height: 0;
      }

      /* ─── Game Top Bar ─── */
      .game-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        background: rgba(0, 0, 0, 0.3);
        border-bottom: 1px solid var(--border-subtle);
        flex-shrink: 0;
        gap: 8px;
      }
      .game-topbar h3 {
        font-family: var(--font-display);
        font-size: 1rem;
        color: var(--accent);
        flex: 1;
      }
      .game-topbar .player-count {
        font-size: 0.8rem;
        color: var(--text-secondary);
      }
      .game-topbar-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }
      .game-pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 10px;
        border-radius: var(--radius-pill);
        font-size: 0.72rem;
        font-weight: 700;
        white-space: nowrap;
        border: 1px solid var(--border-subtle);
        background: var(--bg-card);
        color: var(--text-secondary);
      }
      .game-pill .pill-label {
        opacity: 0.65;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-size: 0.65rem;
      }
      .game-pill-code {
        cursor: pointer;
        color: var(--accent);
        border-color: var(--border-glow);
        background: var(--accent-soft);
        font-family: var(--font-display);
        letter-spacing: 1.5px;
        user-select: all;
      }
      .game-pill-code:hover {
        background: rgba(251, 191, 36, 0.22);
      }
      .game-pill-name {
        color: var(--info);
        border-color: rgba(96, 165, 250, 0.25);
        background: rgba(96, 165, 250, 0.1);
      }
      @media (max-width: 480px) {
        .game-pill .pill-label {
          display: none;
        }
        .game-topbar h3 {
          font-size: 0.85rem;
        }
      }

      /* ─── Speaker Toggle ─── */
      .speaker-toggle {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        background: var(--bg-card);
        border: 1.5px solid var(--border-subtle);
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: all var(--transition);
        user-select: none;
        max-width: 420px;
        width: 100%;
        margin: 8px 0;
      }
      .speaker-toggle:hover {
        border-color: var(--accent);
      }
      .speaker-toggle.active {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .speaker-toggle .speaker-icon {
        font-size: 1.3rem;
        flex-shrink: 0;
      }
      .speaker-toggle .speaker-info {
        flex: 1;
      }
      .speaker-toggle .speaker-label {
        font-weight: 700;
        font-size: 0.9rem;
        color: var(--text-primary);
      }
      .speaker-toggle .speaker-desc {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-top: 2px;
      }
      .speaker-toggle .speaker-switch {
        width: 44px;
        height: 24px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        position: relative;
        transition: background 0.2s;
        flex-shrink: 0;
      }
      .speaker-toggle.active .speaker-switch {
        background: var(--accent);
      }
      .speaker-toggle .speaker-switch::after {
        content: "";
        width: 18px;
        height: 18px;
        background: white;
        border-radius: 50%;
        position: absolute;
        top: 3px;
        left: 3px;
        transition: transform 0.2s;
      }
      .speaker-toggle.active .speaker-switch::after {
        transform: translateX(20px);
      }

      .speaker-btn-mini {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--bg-glass);
        border: 1.5px solid var(--border-subtle);
        color: var(--text-secondary);
        font-size: 1.1rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        flex-shrink: 0;
      }
      .speaker-btn-mini:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .speaker-btn-mini.active {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent);
      }

      .voice-select {
        margin-top: 8px;
        width: 100%;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--border-subtle);
        color: var(--text-primary);
        padding: 8px 12px;
        border-radius: 8px;
        font-family: var(--font-body);
        font-size: 0.8rem;
      }
      .voice-select option {
        background: var(--bg-surface);
      }

      /* ─── Loading ─── */
      .loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        flex: 1;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid var(--border-subtle);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .loader p {
        color: var(--text-secondary);
        font-weight: 500;
      }

      /* ─── Status Bar ─── */
      .status-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 10px 16px;
        text-align: center;
        font-size: 0.8rem;
        color: var(--text-muted);
        background: rgba(10, 14, 26, 0.9);
        border-top: 1px solid var(--border-subtle);
        z-index: 90;
      }
      .status-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 6px;
        vertical-align: middle;
      }
      .status-dot.connected {
        background: var(--success);
        box-shadow: 0 0 8px var(--success);
      }
      .status-dot.connecting {
        background: var(--accent);
        animation: pulse-soft 1.5s infinite;
      }
      .status-dot.disconnected {
        background: var(--danger);
      }

      /* ─── Local Mode Badge ─── */
      .mode-badge {
        display: inline-block;
        font-size: 0.7rem;
        padding: 3px 10px;
        border-radius: var(--radius-pill);
        background: rgba(99, 102, 241, 0.15);
        color: #818cf8;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-left: 8px;
      }

      /* ─── Responsive ─── */
      @media (min-width: 640px) {
        .game-grid {
          grid-template-columns: 1fr 1fr;
        }
        .screen {
          padding: 24px;
        }
      }
      @media (max-height: 600px) {
        .logo {
          margin-top: 4vh;
          font-size: 2rem;
        }
        .logo-sub {
          margin-bottom: 20px;
        }
      }
    </style>
  </head>
  <body>
    <!-- ═══════════════ SCREEN: HOME ═══════════════ -->
    <div id="screen-home" class="screen">
      <h1 class="logo">PARTY ARENA</h1>
      <p class="logo-sub">No servers. No downloads. Just vibes.</p>

      <div class="name-input-wrap">
        <input
          type="text"
          id="player-name"
          placeholder="Your Name"
          maxlength="20"
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <div class="card slide-up" style="animation-delay: 0.1s">
        <div class="card-title"><span class="emoji">🎯</span> Create Room</div>
        <button class="btn btn-primary btn-block" id="btn-create" disabled>
          Create Room (P2P)
        </button>
        <button
          class="btn btn-secondary btn-block"
          id="btn-create-server"
          disabled
          style="margin-top: 8px"
        >
          Create Room (Server)
        </button>
        <div style="text-align: center; margin-top: 8px">
          <button
            class="btn btn-secondary btn-sm"
            id="btn-local"
            disabled
            style="font-size: 0.75rem"
          >
            ⚡ Local / Offline Mode
          </button>
        </div>
      </div>

    <!-- ═══════════════ PeerJS CDN ═══════════════ -->

    <script type="module">
      // ════════════════════════════════════════════════
      //  GAME REGISTRY — add new games here
      // ════════════════════════════════════════════════
      const GAME_REGISTRY = [

        {

          emoji: "🚗",
          description:
            "FAO Schwarz RC bumper cars — everyone drives! Smash opponents, watch their driver cry, earn points. 2-minute chaos for 2–8 players.",
          minPlayers: 1,

          src: "./games/bumper-cars.js",
        },
        // Add more games here — they'll auto-appear in the lobby
      ];

      // ════════════════════════════════════════════════
      //  STATE
      // ════════════════════════════════════════════════
      const state = {
        myName: "",
        myId: "",
        roomCode: "",
        isHost: false,
        isLocal: false,
        transport: "p2p", // "p2p" | "cloudflare" — set by net.init() based on room code prefix
        players: [], // [{ id, name, isHost }]
        selectedGame: null,
        peer: null,
        connections: {}, // peerId -> DataConnection
        currentGame: null,
        listeners: {},
        speakerOn: false,
        selectedVoice: null,
        _resumeState: null, // host-only game-state snapshot from welcome, consumed once by getResumeState()
      };

      // ════════════════════════════════════════════════
      //  UTILITIES
      // ════════════════════════════════════════════════
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => document.querySelectorAll(s);

      // WORKER_URL is injected at build time by the Vite plugin in vite.config.ts
      // (replaces https://party-signaling.yugam1.workers.dev with the value of VITE_WORKER_URL from .env.production).
      // In local dev (npm run dev), the file is served raw from public/ without
      // processing, so the token stays as-is — the check below detects that and
      // falls back to localhost:8787 where `wrangler dev` is running concurrently.
      const _rawWorkerUrl = 'https://party-signaling.yugam1.workers.dev';
      // In dev, fall back to the hostname the page itself was loaded from
      // (not a hardcoded "localhost") so a phone on the same LAN — which
      // loads the page via the dev machine's LAN IP — talks to that same
      // IP for the Worker instead of resolving "localhost" to itself.
      const WORKER_URL = _rawWorkerUrl.startsWith('__')
        ? `http://${location.hostname}:8787`
        : _rawWorkerUrl;

      // Server-backed rooms are prefixed with "S" so a joiner's client
      // can tell which transport to use just from the room code, with
      // no extra UI step. P2P rooms keep the plain 4-letter code
      // (backward compatible with any room created before this existed).
      function genCode(serverBacked = false) {
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ";
        let c = "";
        for (let i = 0; i < 4; i++)
          c += chars[Math.floor(Math.random() * chars.length)];
        return serverBacked ? "S" + c : c;
      }

      function isServerCode(code) {
        return code.length === 5 && code[0] === "S";
      }

      function genId() {
        return Math.random().toString(36).substring(2, 10);
      }

      const PLAYER_COLORS = [
        "#fbbf24",
        "#34d399",
        "#60a5fa",
        "#f87171",
        "#a78bfa",
        "#fb923c",
        "#2dd4bf",
        "#e879f9",
        "#facc15",
        "#38bdf8",
        "#f472b6",
        "#4ade80",
      ];

      function playerColor(index) {
        return PLAYER_COLORS[index % PLAYER_COLORS.length];
      }

      function showScreen(id) {
        $$(".screen").forEach((s) => {
          if (s.id === id) {
            s.classList.remove("hidden", "out");
            s.classList.add("fade-in");
          } else {
            s.classList.add("out");
            setTimeout(() => {
              s.classList.add("hidden");
              s.classList.remove("out");
            }, 350);
          }
        });
      }

      function setStatus(type, text) {
        const dot = $("#status-dot");
        dot.className = "status-dot " + type;
        $("#status-text").textContent = text;
      }

      function toast(msg) {
        const el = document.createElement("div");
        el.className = "copied-toast";
        el.textContent = msg;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2000);
      }

      // ════════════════════════════════════════════════
      //  TEXT-TO-SPEECH ENGINE
      // ════════════════════════════════════════════════
      const tts = {
        supported: "speechSynthesis" in window,
        voices: [],
        initialized: false,

        init() {
          if (!tts.supported || tts.initialized) return;
          tts.initialized = true;

          const loadVoices = () => {
            tts.voices = speechSynthesis
              .getVoices()
              .filter((v) => v.lang.startsWith("en"));
            // Also include non-English for multilingual groups
            const allVoices = speechSynthesis.getVoices();
            if (tts.voices.length === 0) tts.voices = allVoices;
            tts.populateSelect();
          };

          loadVoices();
          // Chrome fires this async
          speechSynthesis.onvoiceschanged = loadVoices;
        },

        populateSelect() {
          const sel = document.querySelector("#voice-select");
          if (!sel) return;
          sel.innerHTML = tts.voices
            .map(
              (v, i) => `
      <option value="${i}" ${v.default ? "selected" : ""}>
        ${v.name} (${v.lang})
      </option>
    `,
            )
            .join("");

          // Restore saved preference
          const saved = localStorage.getItem("pa-voice");
          if (saved) {
            const idx = tts.voices.findIndex((v) => v.name === saved);
            if (idx >= 0) sel.value = idx;
          }

          sel.addEventListener("change", () => {
            state.selectedVoice = tts.voices[sel.value] || null;
            if (state.selectedVoice) {
              localStorage.setItem("pa-voice", state.selectedVoice.name);
            }
            // Preview
            tts.speak("Voice selected", true);
          });

          state.selectedVoice = tts.voices[sel.value] || tts.voices[0] || null;
        },

        speak(text, force = false) {
          if (!tts.supported) return;
          if (!state.speakerOn && !force) return;

          // Cancel any ongoing speech
          speechSynthesis.cancel();

          const utter = new SpeechSynthesisUtterance(text);
          utter.rate = 0.95;
          utter.pitch = 1.0;
          utter.volume = 1.0;

          if (state.selectedVoice) {
            utter.voice = state.selectedVoice;
          }

          // iOS Safari fix: must resume in user gesture context
          speechSynthesis.speak(utter);
        },

        stop() {
          if (tts.supported) speechSynthesis.cancel();
        },

        toggle() {
          state.speakerOn = !state.speakerOn;
          localStorage.setItem("pa-speaker", state.speakerOn ? "1" : "0");
          tts.updateUI();

          if (state.speakerOn) {
            tts.init();
            // Warm up with a short utterance (needed on mobile)
            tts.speak("Announcer on", true);
          } else {
            tts.stop();
          }
        },

        updateUI() {
          const lobbyToggle = $("#speaker-toggle");
          const gameBtn = $("#speaker-btn-game");
          const voiceSel = $("#voice-select");

          if (lobbyToggle) {
            lobbyToggle.classList.toggle("active", state.speakerOn);
            lobbyToggle.querySelector(".speaker-icon").textContent =
              state.speakerOn ? "🔊" : "🔇";
          }
          if (gameBtn) {
            gameBtn.classList.toggle("active", state.speakerOn);
            gameBtn.textContent = state.speakerOn ? "🔊" : "🔇";
          }
          if (voiceSel) {
            voiceSel.classList.toggle("hidden", !state.speakerOn);
          }
        },
      };

      // Restore speaker preference
      state.speakerOn = localStorage.getItem("pa-speaker") === "1";

      // ════════════════════════════════════════════════
      //  P2P TRANSPORT (PeerJS) — no server, host-authoritative
      // ════════════════════════════════════════════════
      const p2pTransport = {
        init(roomCode, isHost) {
          return new Promise((resolve, reject) => {
            const peerId = isHost
              ? `partyarena-${roomCode}`
              : `partyarena-${genId()}`;
            state.myId = peerId;

            const peer = new Peer(peerId, {
              debug: 0,
              config: {
                iceServers: [
                  { urls: "stun:stun.l.google.com:19302" },
                  { urls: "stun:stun1.l.google.com:19302" },
                ],
              },
            });
            state.peer = peer;

            peer.on("open", (id) => {
              console.log("[Net] Peer open:", id);
              setStatus("connected", isHost ? "Hosting room" : "Connected");
              // Resolve with the same shape cloudflareTransport uses, so the
              // net.init() dispatcher gives callers one consistent contract
              // regardless of transport. P2P has no server-side phase
              // memory, so isHost/roomPhase just reflect what the caller
              // already told us (createRoom/join already know this).
              resolve({
                playerId: id,
                isHost,
                roomPhase: "lobby",
                selectedGame: null,
              });
            });

            peer.on("error", (err) => {
              console.error("[Net] Peer error:", err);
              if (err.type === "unavailable-id") {
                setStatus("disconnected", "Room code taken — try again");
                reject(err);
              } else if (err.type === "peer-unavailable") {
                setStatus("disconnected", "Room not found");
                reject(err);
              } else {
                setStatus("disconnected", `Error: ${err.type}`);
              }
            });

            peer.on("disconnected", () =>
              setStatus("connecting", "Reconnecting..."),
            );

            if (isHost) {
              peer.on("connection", (conn) => p2pTransport.handleConnection(conn));
            }
          });
        },

        connectTo(hostCode) {
          return new Promise((resolve, reject) => {
            const conn = state.peer.connect(`partyarena-${hostCode}`, {
              reliable: true,
              metadata: { name: state.myName },
            });

            conn.on("open", () => {
              state.connections[conn.peer] = conn;
              p2pTransport.setupConn(conn);
              resolve(conn);
            });

            conn.on("error", reject);

            setTimeout(() => reject(new Error("Connection timeout")), 10000);
          });
        },

        handleConnection(conn) {
          conn.on("open", () => {
            state.connections[conn.peer] = conn;
            p2pTransport.setupConn(conn);

            // Add player
            const player = {
              id: conn.peer,
              name: conn.metadata?.name || "Player",
              isHost: false,
            };
            state.players.push(player);
            renderPlayerList();

            // Send full state to new player
            conn.send({
              type: "room-sync",
              players: state.players,
              selectedGame: state.selectedGame,
            });

            // Notify others
            p2pTransport.broadcast(
              {
                type: "player-joined",
                player,
              },
              conn.peer,
            );
          });
        },

        setupConn(conn) {
          conn.on("data", (data) => p2pTransport.onMessage(data, conn.peer));
          conn.on("close", () => {
            delete state.connections[conn.peer];
            state.players = state.players.filter((p) => p.id !== conn.peer);
            renderPlayerList();
            p2pTransport.broadcast({ type: "player-left", playerId: conn.peer });
            fireGameEvent("player-left", { playerId: conn.peer });
          });
        },

        onMessage(data, fromPeer) {
          switch (data.type) {
            case "room-sync":
              state.players = data.players;
              if (data.selectedGame) state.selectedGame = data.selectedGame;
              renderPlayerList();
              renderGameGrid();
              break;

            case "player-joined":
              if (!state.players.find((p) => p.id === data.player.id)) {
                state.players.push(data.player);
              }
              renderPlayerList();
              break;

            case "player-left":
              state.players = state.players.filter(
                (p) => p.id !== data.playerId,
              );
              renderPlayerList();
              fireGameEvent("player-left", { playerId: data.playerId });
              break;

            case "player-kicked":
              // Am I the one being kicked?
              if (data.playerId === state.myId) {
                p2pTransport.destroy();
                state.players = [];
                state.selectedGame = null;
                state.currentGame = null;
                clearGameListeners();
                setStatus("disconnected", "You were removed from the room");
                showScreen("screen-home");
                showKickedBanner();
              } else {
                state.players = state.players.filter(
                  (p) => p.id !== data.playerId,
                );
                renderPlayerList();
                fireGameEvent("player-left", { playerId: data.playerId });
              }
              break;

            case "game-selected":
              state.selectedGame = data.gameId;
              renderGameGrid();
              break;

            case "game-start":
              state.selectedGame = data.gameId;
              loadAndStartGame(data.gameId);
              break;

            case "game-end":
              backToLobby();
              break;

            case "game-action":
              fireGameEvent(data.action, data.payload, fromPeer);
              break;

            default:
              // Forward to game listeners
              fireGameEvent(data.type, data, fromPeer);
          }

          // Host relays to everyone else
          if (state.isHost && data.type !== "room-sync") {
            p2pTransport.broadcast(data, fromPeer);
          }
        },

        broadcast(data, excludePeer) {
          Object.entries(state.connections).forEach(([peerId, conn]) => {
            if (peerId !== excludePeer && conn.open) {
              try {
                conn.send(data);
              } catch (e) {
                console.warn("[Net] Send fail:", e);
              }
            }
          });
        },

        send(data) {
          if (state.isLocal) {
            // Local mode: simulate receiving own message
            setTimeout(() => p2pTransport.onMessage(data, state.myId), 10);
            return;
          }
          if (state.isHost) {
            p2pTransport.broadcast(data);
          } else {
            // Send to host
            const hostConn = Object.values(state.connections)[0];
            if (hostConn?.open) hostConn.send(data);
          }
        },

        kickPlayer(playerId) {
          if (!state.isHost) return;

          // Notify everyone (including the kicked player) before closing
          const kickMsg = { type: "player-kicked", playerId };
          p2pTransport.broadcast(kickMsg);

          // Close connection to kicked player
          const conn = state.connections[playerId];
          if (conn) {
            setTimeout(() => {
              conn.close();
              delete state.connections[playerId];
            }, 200);
          }

          // Remove from local state
          state.players = state.players.filter((p) => p.id !== playerId);
          renderPlayerList();
          fireGameEvent("player-left", { playerId });
        },

        sendTo(peerId, data) {
          if (!state.isHost) return;
          const conn = state.connections[peerId];
          if (conn?.open) {
            try {
              conn.send(data);
            } catch (e) {
              console.warn("[Net] SendTo fail:", e);
            }
          }
        },

        destroy() {
          Object.values(state.connections).forEach((c) => c.close());
          state.connections = {};
          if (state.peer) {
            state.peer.destroy();
            state.peer = null;
          }
        },
      };

      // ════════════════════════════════════════════════
      //  CLOUDFLARE TRANSPORT — WebSocket to the Worker/Durable Object.
      //  Mirrors the p2pTransport method surface so the `net` dispatcher
      //  below can route to either transport without callers caring.
      // ════════════════════════════════════════════════
      const cloudflareTransport = {
        ws: null,

        init(roomCode, isHost) {
          return new Promise((resolve, reject) => {
            if (!WORKER_URL) {
              reject(new Error("WORKER_URL is not configured"));
              return;
            }

            // Strip the "S" prefix for the actual DO room key.
            const bareCode = roomCode.startsWith("S")
              ? roomCode.slice(1)
              : roomCode;

            // Persist a playerId per (bareCode) so a later reconnect in
            // this browser can re-attach — full state restore on the
            // server side is a follow-up, but the client already keeps
            // its half of the handshake ready.
            const storageKey = `pa-playerid-${bareCode}`;
            let playerId = localStorage.getItem(storageKey);
            if (!playerId) {
              playerId = genId();
              localStorage.setItem(storageKey, playerId);
            }
            state.myId = playerId;

            const wsUrl = WORKER_URL.replace(/^http/, "ws") +
              `/room/${bareCode}/ws?playerId=${playerId}`;
            const ws = new WebSocket(wsUrl);
            cloudflareTransport.ws = ws;
            cloudflareTransport._roomCode = bareCode;

            ws.addEventListener("open", () => {
              setStatus("connecting", "Negotiating room...");
            });

            ws.addEventListener("message", (event) => {
              let msg;
              try {
                msg = JSON.parse(event.data);
              } catch {
                return;
              }
              cloudflareTransport.handleServerMessage(msg, isHost, resolve, reject);
            });

            ws.addEventListener("close", () => {
              setStatus("disconnected", "Disconnected from server");
            });

            ws.addEventListener("error", (err) => {
              console.error("[CloudflareTransport] WS error:", err);
              setStatus("disconnected", "Connection error");
              reject(err);
            });

            // If host, also tell the room which mode to run in.
            // (Currently always "relay" — authoritative mode is a later step.)
            if (isHost) {
              fetch(`${WORKER_URL}/room/${bareCode}/init`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ mode: "relay" }),
              }).catch((e) =>
                console.warn("[CloudflareTransport] init call failed:", e),
              );
            }
          });
        },

        handleServerMessage(msg, isHost, resolve, reject) {
          switch (msg.type) {
            case "welcome":
              // Server is authoritative on host identity and room phase —
              // trust it over whatever this client assumed when it called
              // net.init() (important specifically for the reconnecting-host
              // case: the client went through the "join" code path, which
              // defaults isHost to false, but the server remembers the
              // original host's playerId across reconnects).
              state.isHost = !!msg.isHost;
              cloudflareTransport._roomPhase = msg.roomPhase || "lobby";
              if (msg.selectedGame) state.selectedGame = msg.selectedGame;
              // Host-only game-state snapshot (see api.setResumeState/
              // getResumeState) — stashed for createGameAPI() to hand back
              // to the game module when it calls getResumeState() at startup.
              state._resumeState = msg.resumeState || null;

              setStatus("connected", isHost ? "Hosting room" : "Connected");
              resolve({
                playerId: state.myId,
                isHost: state.isHost,
                roomPhase: cloudflareTransport._roomPhase,
                selectedGame: msg.selectedGame || null,
              });
              break;

            case "peer-joined":
            case "peer-reconnected": {
              if (msg.playerId === state.myId) break;
              const exists = state.players.find((p) => p.id === msg.playerId);
              if (!exists) {
                state.players.push({
                  id: msg.playerId,
                  name: "Player",
                  isHost: false,
                });
                renderPlayerList();
              }
              // Host re-sends room-sync so the (re)joining peer gets full state.
              if (state.isHost) {
                cloudflareTransport.sendTo(msg.playerId, {
                  type: "room-sync",
                  players: state.players,
                  selectedGame: state.selectedGame,
                });
                // Mid-game reconnect: let the active game module know it
                // should re-push its current view to this specific player.
                // Uniform across all games — see api.onPlayerRejoinedMidgame.
                if (msg.type === "peer-reconnected" && cloudflareTransport._roomPhase === "in-game") {
                  fireGameEvent("player-rejoined-midgame", { playerId: msg.playerId });
                }
              } else if (msg.type === "peer-reconnected") {
                // The peer that just reconnected might be the host (e.g. host
                // dropped mid-game and rejoined). The DO doesn't tell us that
                // directly here, and the host's own room-sync above only
                // covers cases where THIS client already knew it was host.
                // So: every non-host client re-announces itself whenever
                // anyone reconnects, cheaply rebuilding the host's player
                // list without needing the DO to broadcast names it doesn't
                // track. Harmless no-op if the reconnecting peer wasn't host.
                cloudflareTransport.broadcast({
                  type: "player-joined",
                  player: { id: state.myId, name: state.myName, isHost: state.isHost },
                });
              }
              break;
            }

            case "peer-disconnected":
              // Kept intentionally soft for now: mark as disconnected rather
              // than removing, so reconnect (follow-up work) has something
              // to re-attach to. UI treatment of this is a follow-up too.
              fireGameEvent("player-left", { playerId: msg.playerId });
              break;

            case "room-closed":
              setStatus("disconnected", "Room closed (inactivity)");
              break;

            case "signal":
              // Reserved for future WebRTC-over-Cloudflare-relay use; not
              // used by the current room-sync / game-action protocol.
              break;

            case "message":
              cloudflareTransport.onMessage(msg.payload, msg.from);
              break;

            default:
              break;
          }
        },

        onMessage(data, fromPeer) {
          // Same application-level protocol as p2pTransport (room-sync,
          // player-joined, game-action, etc.) but routed through this
          // transport's own broadcast/destroy, not p2pTransport's.
          switch (data.type) {
            case "room-sync":
              state.players = data.players;
              if (data.selectedGame) state.selectedGame = data.selectedGame;
              renderPlayerList();
              renderGameGrid();
              break;

            case "player-joined": {
              const idx = state.players.findIndex((p) => p.id === data.player.id);
              if (idx === -1) {
                state.players.push(data.player);
              } else {
                // Upsert rather than ignore — this is also how a reconnecting
                // host's re-announce gets its corrected isHost:true picked up
                // by clients that still have a stale pre-disconnect entry.
                state.players[idx] = { ...state.players[idx], ...data.player };
              }
              renderPlayerList();
              break;
            }

            case "player-left":
              state.players = state.players.filter(
                (p) => p.id !== data.playerId,
              );
              renderPlayerList();
              fireGameEvent("player-left", { playerId: data.playerId });
              break;

            case "player-kicked":
              if (data.playerId === state.myId) {
                cloudflareTransport.destroy();
                state.players = [];
                state.selectedGame = null;
                state.currentGame = null;
                clearGameListeners();
                setStatus("disconnected", "You were removed from the room");
                showScreen("screen-home");
                showKickedBanner();
              } else {
                state.players = state.players.filter(
                  (p) => p.id !== data.playerId,
                );
                renderPlayerList();
                fireGameEvent("player-left", { playerId: data.playerId });
              }
              break;

            case "game-selected":
              state.selectedGame = data.gameId;
              renderGameGrid();
              break;

            case "game-start":
              state.selectedGame = data.gameId;
              cloudflareTransport._roomPhase = "in-game";
              loadAndStartGame(data.gameId);
              break;

            case "game-end":
              cloudflareTransport._roomPhase = "lobby";
              backToLobby();
              break;

            case "game-action":
              fireGameEvent(data.action, data.payload, fromPeer);
              break;

            default:
              fireGameEvent(data.type, data, fromPeer);
          }

          // Host relays to everyone else (the DO already broadcasts to all
          // sockets, so this would double-send on the wire — skip it here.
          // Unlike p2pTransport, the relay step is handled server-side.)
        },

        broadcast(data) {
          if (cloudflareTransport.ws?.readyState === WebSocket.OPEN) {
            cloudflareTransport.ws.send(
              JSON.stringify({ type: "message", payload: data }),
            );
          }
        },

        send(data) {
          // The DO relay broadcasts to the whole room; the room-level
          // onMessage handler (reused from p2pTransport) replicates the
          // same host-relay logic, so guests effectively "send to host"
          // by broadcasting and letting onMessage's host-only branches apply.
          cloudflareTransport.broadcast(data);
        },

        sendTo(playerId, data) {
          // Not yet supported as a true unicast by the relay-mode DO without
          // a dedicated message type; falls back to broadcast for now.
          cloudflareTransport.broadcast(data);
        },

        kickPlayer(playerId) {
          if (!state.isHost) return;
          cloudflareTransport.broadcast({ type: "player-kicked", playerId });
          state.players = state.players.filter((p) => p.id !== playerId);
          renderPlayerList();
          fireGameEvent("player-left", { playerId });
        },

        // Host-only: persist a game-state snapshot to the DO so a future
        // reconnect of THIS SAME host can restore it (see room.js
        // lastResumeState / welcome.resumeState). Throttled to one send
        // per 500ms — games may call this on every move/tick, and there's
        // no need to hit the wire that often for something only read back
        // on reconnect.
        _resumeStateThrottle: null,
        _pendingResumeState: undefined,
        setResumeState(snapshot) {
          cloudflareTransport._pendingResumeState = snapshot;
          if (cloudflareTransport._resumeStateThrottle) return;
          cloudflareTransport._resumeStateThrottle = setTimeout(() => {
            cloudflareTransport._resumeStateThrottle = null;
            if (cloudflareTransport.ws?.readyState === WebSocket.OPEN) {
              cloudflareTransport.ws.send(
                JSON.stringify({
                  type: "message",
                  payload: { type: "resume-state", snapshot: cloudflareTransport._pendingResumeState },
                }),
              );
            }
          }, 500);
        },

        destroy() {
          if (cloudflareTransport.ws) {
            cloudflareTransport.ws.close();
            cloudflareTransport.ws = null;
          }
        },
      };

      // ════════════════════════════════════════════════
      //  NET DISPATCHER — routes to whichever transport is active.
      //  Everything else in this file (createGameAPI, button handlers,
      //  etc.) calls `net.xxx` exactly as before; only this object needs
      //  to know that two transports exist.
      // ════════════════════════════════════════════════
      const net = {
        init(roomCode, isHost) {
          state.transport = isServerCode(roomCode) ? "cloudflare" : "p2p";
          const impl = state.transport === "cloudflare" ? cloudflareTransport : p2pTransport;
          return impl.init(roomCode, isHost);
        },
        connectTo(hostCode) {
          const impl = state.transport === "cloudflare" ? cloudflareTransport : p2pTransport;
          // cloudflareTransport doesn't need a separate connect step —
          // the WebSocket opened in init() already joins the room.
          if (state.transport === "cloudflare") return Promise.resolve();
          return impl.connectTo(hostCode);
        },
        send(data) {
          const impl = state.transport === "cloudflare" ? cloudflareTransport : p2pTransport;
          impl.send(data);
        },
        broadcast(data, excludePeer) {
          const impl = state.transport === "cloudflare" ? cloudflareTransport : p2pTransport;
          impl.broadcast(data, excludePeer);
        },
        sendTo(peerId, data) {
          const impl = state.transport === "cloudflare" ? cloudflareTransport : p2pTransport;
          impl.sendTo(peerId, data);
        },
        kickPlayer(playerId) {
          const impl = state.transport === "cloudflare" ? cloudflareTransport : p2pTransport;
          impl.kickPlayer(playerId);
        },
        setResumeState(snapshot) {
          // Only cloudflareTransport has server-side memory to persist this
          // into — P2P's "server" is the host's own browser tab, which is
          // exactly what disconnects when the host reconnect problem
          // happens, so there's nowhere durable to stash it. No-op there.
          if (state.transport === "cloudflare") cloudflareTransport.setResumeState(snapshot);
        },
        destroy() {
          const impl = state.transport === "cloudflare" ? cloudflareTransport : p2pTransport;
          impl.destroy();
        },
      };

      // ════════════════════════════════════════════════
      //  GAME EVENT SYSTEM
      // ════════════════════════════════════════════════
      function onGameEvent(event, cb) {
        if (!state.listeners[event]) state.listeners[event] = [];
        state.listeners[event].push(cb);
      }

      function offGameEvent(event, cb) {
        if (!state.listeners[event]) return;
        state.listeners[event] = state.listeners[event].filter(
          (fn) => fn !== cb,
        );
      }

      function fireGameEvent(event, payload, from) {
        (state.listeners[event] || []).forEach((fn) => fn(payload, from));
      }

      function clearGameListeners() {
        state.listeners = {};
      }

      // ════════════════════════════════════════════════
      //  GAME API — provided to each game module
      // ════════════════════════════════════════════════
      function createGameAPI() {
        return {
          getPlayers: () => [...state.players],
          getMe: () => ({
            id: state.myId,
            name: state.myName,
            isHost: state.isHost,
          }),
          isHost: () => state.isHost,
          isLocal: () => state.isLocal,

          send(action, payload) {
            const msg = {
              type: "game-action",
              action,
              payload,
              from: state.myId,
            };
            net.send(msg);
          },

          broadcast(action, payload) {
            const msg = {
              type: "game-action",
              action,
              payload,
              from: state.myId,
            };
            // Broadcast (host only makes sense, but guests will relay through host)
            net.send(msg);
          },

          on(event, cb) {
            onGameEvent(event, cb);
          },
          off(event, cb) {
            offGameEvent(event, cb);
          },

          // Send privately to one player (host only)
          sendTo(playerId, action, payload) {
            if (!state.isHost) return;
            const msg = {
              type: "game-action",
              action,
              payload,
              from: state.myId,
            };
            net.sendTo(playerId, msg);
          },

          endGame() {
            net.send({ type: "game-end" });
            if (state.transport === "cloudflare") cloudflareTransport._roomPhase = "lobby";
            backToLobby();
          },

          // ── Game-state resume (host-only) ──────────────────────────
          // Call setResumeState(snapshot) any time your authoritative state
          // changes (same spot you already broadcast/render from). Pass a
          // plain JSON-serializable object — whatever your game needs to
          // fully reconstruct itself. Only meaningful for the host; guests
          // never hold authoritative state in this codebase (the host
          // re-pushes its current view to them on reconnect instead — see
          // onGameEvent('player-rejoined-midgame') below).
          //
          // Call getResumeState() once at the top of create(): if it
          // returns non-null, you're the host resuming after a reconnect —
          // restore your local state from the snapshot instead of
          // initializing fresh. Returns null for guests, local mode, P2P
          // (not yet wired for P2P — see note on net.setResumeState), and
          // any normal fresh game start.
          setResumeState(snapshot) {
            if (!state.isHost || state.isLocal) return;
            net.setResumeState(snapshot);
          },
          getResumeState() {
            const snap = state._resumeState;
            state._resumeState = null; // consume once — avoid re-applying on a later in-game reconnect of a guest, etc.
            return snap;
          },

          // Fires when ANY player (host or guest) reconnects mid-game.
          // Host-side game modules should listen for this and re-send
          // their current view to that player (most games already have a
          // "push current state to everyone" function from their normal
          // broadcast path — just call it here too). This is what makes
          // guest-reconnect work uniformly: guests don't need their own
          // resume logic since they're never authoritative.
          onPlayerRejoinedMidgame(cb) {
            onGameEvent("player-rejoined-midgame", cb);
          },

          // Host: kick a player from the room
          kickPlayer(playerId) {
            if (!state.isHost && !state.isLocal) return;
            if (state.isLocal) {
              state.players = state.players.filter((p) => p.id !== playerId);
              renderPlayerList();
            } else {
              net.kickPlayer(playerId);
            }
          },

          // For local mode: add/manage local players
          addLocalPlayer(name) {
            const p = { id: `local-${genId()}`, name, isHost: false };
            state.players.push(p);
            renderPlayerList();
            return p;
          },

          // Text-to-Speech — reads aloud from host device speaker
          speak(text) {
            tts.speak(text);
          },
          stopSpeaking() {
            tts.stop();
          },
          isSpeakerOn() {
            return state.speakerOn;
          },

          cssVars: {
            accent: "#fbbf24",
            accentSoft: "rgba(251,191,36,0.15)",
            bg: "#0a0e1a",
            bgCard: "rgba(255,255,255,0.04)",
            bgGlass: "rgba(255,255,255,0.06)",
            text: "#f1f5f9",
            textSec: "#94a3b8",
            textMuted: "#64748b",
            success: "#34d399",
            danger: "#f87171",
            info: "#60a5fa",
            radius: "16px",
            radiusSm: "10px",
            radiusPill: "50px",
            fontBody: "'Quicksand', sans-serif",
            fontDisplay: "'Righteous', cursive",
          },
        };
      }

      // ════════════════════════════════════════════════
      //  GAME LOADER (dynamic ES module import)
      // ════════════════════════════════════════════════
      async function loadAndStartGame(gameId) {
        const reg = GAME_REGISTRY.find((g) => g.id === gameId);
        if (!reg) return;

        showScreen("screen-game");
        $("#game-title").textContent = `${reg.emoji} ${reg.name}`;
        $("#game-player-count").textContent = `${state.players.length} players`;
        $("#game-room-code-value").textContent = state.roomCode || "—";
        $("#game-player-name-value").textContent = state.myName || "—";

        const container = $("#game-container");
        container.innerHTML = `
    <div class="loader">
      <div class="spinner"></div>
      <p>Loading ${reg.name}...</p>
    </div>
  `;

        try {
          const mod = await import(reg.src);
          const api = createGameAPI();
          container.innerHTML = "";
          state.currentGame = mod.default.create(container, api);
        } catch (err) {
          console.error("[GameLoader] Failed:", err);
          container.innerHTML = `
      <div class="loader">
        <p style="color:var(--danger);">Failed to load game</p>
        <p style="font-size:0.8rem;color:var(--text-muted);">${err.message}</p>
        <button class="btn btn-secondary btn-sm" onclick="backToLobby()">Back to Lobby</button>
      </div>
    `;
        }
      }

      function backToLobby() {
        if (state.currentGame?.destroy) state.currentGame.destroy();
        state.currentGame = null;
        clearGameListeners();
        $("#game-container").innerHTML = "";
        showScreen("screen-lobby");
      }
      window.backToLobby = backToLobby;

      // ════════════════════════════════════════════════
      //  UI RENDERING
      // ════════════════════════════════════════════════
      function renderPlayerList() {
        const list = $("#player-list");
        list.innerHTML = state.players
          .map((p, i) => {
            const isMe = p.id === state.myId;
            const canKick = state.isHost && !isMe && !p.isHost;
            return `
    <li class="player-item" style="animation-delay:${i * 0.05}s">
      <div class="player-avatar" style="background:${playerColor(i)}20; color:${playerColor(i)};">
        ${p.name.charAt(0).toUpperCase()}
      </div>
      <span class="player-name">${escHtml(p.name)}</span>
      ${p.isHost ? '<span class="player-badge badge-host">Host</span>' : ""}
      ${isMe ? '<span class="player-badge badge-you">You</span>' : ""}
      ${canKick ? `<button class="btn-kick" data-kick-id="${p.id}" data-kick-name="${escHtml(p.name)}" title="Remove player">✕</button>` : ""}
    </li>
  `;
          })
          .join("");

        // Attach kick handlers
        list.querySelectorAll(".btn-kick").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            showKickConfirm(btn.dataset.kickId, btn.dataset.kickName);
          });
        });

        const count = state.players.length;
        const sel = state.selectedGame
          ? GAME_REGISTRY.find((g) => g.id === state.selectedGame)
          : null;
        const minOk = !sel || count >= sel.minPlayers || (state.isLocal && sel.supportsLocal !== false);
        $("#btn-start-game").disabled =
          !state.isHost || !state.selectedGame || !minOk;
      }

      function showKickConfirm(playerId, playerName) {
        const overlay = document.createElement("div");
        overlay.className = "kick-modal-overlay";
        overlay.innerHTML = `
    <div class="kick-modal">
      <h3>Remove Player</h3>
      <p>Kick <strong>${playerName}</strong> from the room?</p>
      <div class="kick-modal-btns">
        <button class="btn btn-secondary btn-sm" id="kick-cancel">Cancel</button>
        <button class="btn btn-danger btn-sm" id="kick-confirm">Kick</button>
      </div>
    </div>
  `;
        document.body.appendChild(overlay);

        overlay
          .querySelector("#kick-cancel")
          .addEventListener("click", () => overlay.remove());
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) overlay.remove();
        });

        overlay.querySelector("#kick-confirm").addEventListener("click", () => {
          if (state.isLocal) {
            // Local mode: just remove from player list
            state.players = state.players.filter((p) => p.id !== playerId);
            renderPlayerList();
          } else {
            net.kickPlayer(playerId);
          }
          overlay.remove();
          toast(`${playerName} removed`);
        });
      }

      function showKickedBanner() {
        // Remove any existing banner
        document.querySelector(".kicked-banner")?.remove();
        const banner = document.createElement("div");
        banner.className = "kicked-banner";
        banner.textContent = "You were removed from the room by the host";
        const home = $("#screen-home");
        home.insertBefore(banner, home.querySelector(".name-input-wrap"));
        setTimeout(() => banner.remove(), 5000);
      }

      function renderGameGrid() {
        const grid = $("#game-grid");
        const count = state.players.length;
        const available = GAME_REGISTRY.filter(
          (g) => !state.isLocal || g.supportsLocal !== false,
        );

        grid.innerHTML = available
          .map((g) => {
            const ok = count >= g.minPlayers;
            const noLocal = state.isLocal && g.supportsLocal === false;
            return `
      <div class="game-card ${state.selectedGame === g.id ? "selected" : ""} ${!ok || noLocal ? "dimmed" : ""}"
           data-game-id="${g.id}" ${!state.isHost || noLocal ? 'style="pointer-events:none"' : ""}>
        <span class="emoji">${g.emoji}</span>
        <h3>${g.name}</h3>
        <p>${g.description}</p>
        <div class="meta">
          ${g.minPlayers}–${g.maxPlayers} players
          ${!ok ? "• Need " + g.minPlayers + "+" : ""}
          ${g.supportsLocal === false ? '• <span style="color:var(--info);">Online only</span>' : ""}
        </div>
      </div>
    `;
          })
          .join("");

        if (state.isHost) {
          grid.querySelectorAll(".game-card").forEach((card) => {
            card.addEventListener("click", () => {
              const reg = GAME_REGISTRY.find(
                (g) => g.id === card.dataset.gameId,
              );
              if (state.isLocal && reg?.supportsLocal === false) return;
              state.selectedGame = card.dataset.gameId;
              net.send({ type: "game-selected", gameId: state.selectedGame });
              renderGameGrid();
              renderPlayerList();
            });
          });
        }

        if (!state.isHost) {
          $("#game-pick-title").textContent = "Game Selection (Host picks)";
        } else {
          $("#game-pick-title").textContent = "Pick a Game";
        }
      }

      function escHtml(s) {
        const d = document.createElement("div");
        d.textContent = s;
        return d.innerHTML;
      }

      // ════════════════════════════════════════════════
      //  EVENT HANDLERS
      // ════════════════════════════════════════════════
      const nameInput = $("#player-name");
      const codeInput = $("#room-code-input");

      // Load saved name
      const savedName = localStorage.getItem("pa-name");
      if (savedName) nameInput.value = savedName;
      updateBtnStates();

      nameInput.addEventListener("input", updateBtnStates);
      codeInput.addEventListener("input", () => {
        codeInput.value = codeInput.value.toUpperCase().replace(/[^A-Z]/g, "");
        updateBtnStates();
      });

      function updateBtnStates() {
        const hasName = nameInput.value.trim().length > 0;
        const code = codeInput.value.trim();
        const hasCode = code.length === 4 || (code.length === 5 && code[0] === "S");
        $("#btn-create").disabled = !hasName;
        $("#btn-create-server").disabled = !hasName;
        $("#btn-local").disabled = !hasName;
        $("#btn-join").disabled = !hasName || !hasCode;
      }

      async function createRoom(serverBacked) {
        const name = nameInput.value.trim();
        if (!name) return;

        state.myName = name;
        state.isHost = true;
        state.isLocal = false;
        state.roomCode = genCode(serverBacked);
        localStorage.setItem("pa-name", name);

        setStatus("connecting", "Creating room...");

        try {
          const result = await net.init(state.roomCode, true);
          state.myId = result.playerId;
          state.players = [{ id: state.myId, name, isHost: true }];

          $("#lobby-room-code").textContent = state.roomCode;
          renderPlayerList();
          renderGameGrid();
          showScreen("screen-lobby");
        } catch (e) {
          // Try a different code (only meaningful for P2P's id-collision case)
          state.roomCode = genCode(serverBacked);
          try {
            const result = await net.init(state.roomCode, true);
            state.myId = result.playerId;
            state.players = [{ id: state.myId, name, isHost: true }];
            $("#lobby-room-code").textContent = state.roomCode;
            renderPlayerList();
            renderGameGrid();
            showScreen("screen-lobby");
          } catch (e2) {
            setStatus("disconnected", "Failed to create room");
          }
        }
      }

      // CREATE ROOM (P2P)
      $("#btn-create").addEventListener("click", () => createRoom(false));

      // CREATE ROOM (Server / Cloudflare)
      $("#btn-create-server").addEventListener("click", () => createRoom(true));

      // LOCAL MODE
      $("#btn-local").addEventListener("click", () => {
        const name = nameInput.value.trim();
        if (!name) return;

        state.myName = name;
        state.myId = `local-host-${genId()}`;
        state.isHost = true;
        state.isLocal = true;
        state.roomCode = "LOCAL";
        localStorage.setItem("pa-name", name);

        state.players = [{ id: state.myId, name, isHost: true }];
        setStatus("connected", "Local mode");

        const codeLine = $("#lobby-room-code");
        codeLine.textContent = "LOCAL";
        codeLine.insertAdjacentHTML(
          "afterend",
          '<span class="mode-badge" id="local-badge">Offline Mode</span>',
        );

        renderPlayerList();
        renderGameGrid();
        showScreen("screen-lobby");
      });

      // JOIN ROOM
      $("#btn-join").addEventListener("click", async () => {
        const name = nameInput.value.trim();
        const code = codeInput.value.trim().toUpperCase();
        const validLength = code.length === 4 || (code.length === 5 && code[0] === "S");
        if (!name || !validLength) return;

        state.myName = name;
        state.isHost = false; // provisional — corrected below from the server's answer
        state.isLocal = false;
        state.roomCode = code;
        localStorage.setItem("pa-name", name);

        setStatus("connecting", "Joining room...");

        try {
          const result = await net.init(code, false);
          await net.connectTo(code);
          state.myId = result.playerId;
          // Cloudflare rooms remember the original host's playerId across
          // reconnects (see room.js hostPlayerId) — if this player created
          // the room earlier, the server tells us isHost: true here even
          // though we went through the "join" flow, not "create". P2P rooms
          // have no such memory, so result.isHost just echoes what we passed in.
          state.isHost = result.isHost;
          if (result.selectedGame) state.selectedGame = result.selectedGame;

          // We'll get room-sync from host with player list
          if (!state.players.find((p) => p.id === state.myId)) {
            state.players.push({ id: state.myId, name, isHost: state.isHost });
          }

          // Announce our real name to the room. Necessary for the Cloudflare
          // transport: the DO only knows bare playerIds (see "peer-joined" in
          // cloudflareTransport.handleServerMessage), so without this the host
          // and other guests add us to their player list with a "Player"
          // placeholder that's never corrected on a fresh join (only on
          // reconnect, which already re-announces). Harmless no-op duplicate
          // for P2P, which already gets the name via connection metadata.
          net.send({
            type: "player-joined",
            player: { id: state.myId, name, isHost: state.isHost },
          });

          $("#lobby-room-code").textContent = code;
          renderPlayerList();
          renderGameGrid();
          setStatus("connected", "Connected to room");

          // Resume mid-game instead of always dropping into the lobby —
          // this is the fix for: host disconnects mid-game, rejoins, and
          // used to get stuck in the lobby with no way back into the game.
          if (result.roomPhase === "in-game" && result.selectedGame) {
            loadAndStartGame(result.selectedGame);
          } else {
            showScreen("screen-lobby");
          }
        } catch (e) {
          setStatus("disconnected", "Could not join room");
        }
      });

      // COPY ROOM CODE
      $("#lobby-room-code").addEventListener("click", () => {
        const code = state.roomCode;
        if (code === "LOCAL") return;
        navigator.clipboard
          ?.writeText(code)
          .then(() => toast("Code copied!"))
          .catch(() => {});
      });

      // COPY ROOM CODE (in-game pill)
      $("#game-room-code").addEventListener("click", () => {
        const code = state.roomCode;
        if (!code || code === "LOCAL") return;
        navigator.clipboard
          ?.writeText(code)
          .then(() => toast("Code copied!"))
          .catch(() => {});
      });

      // START GAME (host only)
      $("#btn-start-game").addEventListener("click", () => {
        if (!state.isHost || !state.selectedGame) return;
        net.send({ type: "game-start", gameId: state.selectedGame });
        if (state.transport === "cloudflare") cloudflareTransport._roomPhase = "in-game";
        loadAndStartGame(state.selectedGame);
      });

      // LEAVE ROOM
      $("#btn-leave").addEventListener("click", () => {
        net.destroy();
        state.players = [];
        state.selectedGame = null;
        state.currentGame = null;
        clearGameListeners();
        setStatus("disconnected", "Not connected");
        document.getElementById("local-badge")?.remove();
        showScreen("screen-home");
      });

      // BACK TO LOBBY (from game)
      $("#btn-back-lobby").addEventListener("click", () => {
        tts.stop();
        backToLobby();
        net.send({ type: "game-end" });
        if (state.transport === "cloudflare") cloudflareTransport._roomPhase = "lobby";
      });

      // SPEAKER TOGGLE (lobby)
      $("#speaker-toggle").addEventListener("click", () => {
        tts.toggle();
      });

      // SPEAKER TOGGLE (in-game mini button)
      $("#speaker-btn-game").addEventListener("click", () => {
        tts.toggle();
      });

      // Init TTS UI on load (restore saved state)
      tts.init();
      tts.updateUI();

      // Auto-focus
      nameInput.focus();

      // Handle Enter keys
      nameInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") $("#btn-create").click();
      });
      codeInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") $("#btn-join").click();
      });
    </script>
  </body>
</html>
