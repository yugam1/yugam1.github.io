  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      height: 100vh
    }

    @keyframes popIn {
      0% {
        transform: scale(0) rotate(-20deg);
        opacity: 0
      }

      50% {
        transform: scale(1.2) rotate(3deg)
      }

      100% {
        transform: scale(1) rotate(0);
        opacity: 1
      }
    }

    @keyframes slideUp {
      0% {
        transform: translateY(30px);
        opacity: 0
      }

      100% {
        transform: translateY(0);
        opacity: 1
      }
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0)
      }

      15% {
        transform: translateX(-10px) rotate(-1deg)
      }

      30% {
        transform: translateX(10px) rotate(1deg)
      }

      45% {
        transform: translateX(-6px)
      }

      60% {
        transform: translateX(6px)
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1)
      }

      50% {
        transform: scale(1.08)
      }
    }

    @keyframes bgPan {
      0% {
        background-position: 0% 50%
      }

      50% {
        background-position: 100% 50%
      }

      100% {
        background-position: 0% 50%
      }
    }

    @keyframes particle {
      0% {
        transform: translateY(0) scale(1);
        opacity: .9
      }

      100% {
        transform: translateY(-140px) scale(0);
        opacity: 0
      }
    }

    @keyframes fadeIn {
      0% {
        opacity: 0
      }

      100% {
        opacity: 1
      }
    }

    .btn {
      border: none;
      cursor: pointer;
      font-family: monospace;
      font-weight: 700;
      transition: transform .15s
    }

    .btn:hover {
      transform: scale(1.05)
    }

    ::-webkit-scrollbar {
      width: 4px
    }

    ::-webkit-scrollbar-thumb {
      background: #222;
      border-radius: 4px
    }
  </style>
</head>

            var vi = -1; for (var j = 0; j < S.kNums.length; j++) { if (S.kNums[j].includes(hit.seg) && j !== S.cp && S.kLives[j] > 0) { vi = j; break; } }
            if (vi >= 0) { S.kLives[vi] = Math.max(0, S.kLives[vi] - 1); checkKillerWin(); S.meme = S.kLives[vi] <= 0 ? Object.assign({}, pickMeme("killer_kill"), { sub: S.players[vi].n + ' ELIMINATED!' }) : Object.assign({}, pickMeme("beast"), { sub: S.players[vi].n + ': ' + S.kLives[vi] + ' lives' }); }
            else S.meme = pickMeme(hit.sc === 0 ? "roast" : "meh");
          }
        }
        render(); autoDissmiss(); return;
      }
      if (g === "cricket") {
        S.darts.push(hit);
        var seg = hit.seg;
        if (CRICKET_NUMS.includes(seg)) {
          var cur = S.crMarks[S.cp][seg];
          var marksToAdd = hit.mul;
          var newM = cur + marksToAdd;
          var closingNeeded = Math.max(0, 3 - cur);
          var scoringMarks = Math.max(0, marksToAdd - closingNeeded);
          var allOpClosed = S.players.every(function (p, i) { return i === S.cp || S.crMarks[i][seg] >= 3; });
          if (!allOpClosed && scoringMarks > 0) {
            var ptVal = seg === 25 ? 25 : seg;
            S.crPoints[S.cp] += scoringMarks * ptVal;
          }
          S.crMarks[S.cp][seg] = newM;
          var allClosed = CRICKET_NUMS.every(function (n) { return S.crMarks[S.cp][n] >= 3; });
          var topPts = S.players.every(function (p, i) { return i === S.cp || S.crPoints[S.cp] >= S.crPoints[i]; });
          if (allClosed && topPts) {
            S.winner = S.players[S.cp].n;
            S.meme = Object.assign({}, pickMeme("legendary"), { sub: '🏆 ' + S.winner + ' WINS!', isWin: true });
          } else if (newM >= 3 && cur < 3) {
            S.meme = Object.assign({}, pickMeme("beast"), { sub: (seg === 25 ? 'BULL' : seg) + ' CLOSED!' });
          } else if (scoringMarks > 0) {
            S.meme = Object.assign({}, pickMeme("hype"), { sub: '+' + (scoringMarks * (seg === 25 ? 25 : seg)) + ' pts!' });
          } else if (marksToAdd > 0) {
            S.meme = pickMeme("hype");
          } else S.meme = pickMeme(hit.sc === 0 ? "roast" : "meh");
        } else {
          S.meme = pickMeme(hit.sc === 0 ? "roast" : "meh");
        }
        render(); autoDissmiss(); return;
      }
      if (g === "bowling") {
        var pi = S.cp, fi = S.bFrame[pi];
        if (fi >= 10) return;
        var fr = S.bFrames[pi][fi];
        var max10 = 10;
        if (fi < 9) { max10 = 10 - fr.throws.reduce(function (a, b) { return a + b }, 0); }
        else {
          if (fr.throws.length === 0) max10 = 10;
          else if (fr.throws.length === 1) max10 = fr.throws[0] === 10 ? 10 : 10 - fr.throws[0];
          else { if (fr.throws[0] === 10) max10 = fr.throws[1] === 10 ? 10 : 10 - fr.throws[1]; else if (fr.throws[0] + fr.throws[1] === 10) max10 = 10; }
        }
        var pins = dartToPins(hit.sc, max10);

        S.bAllThrows[pi].push(pins);
        S.darts.push(hit);
        var done = isBowlingFrameDone();
        var isStrike = fi < 9 && fr.throws.length === 1 && pins === 10;
        var isSpare = fi < 9 && fr.throws.length === 2 && fr.throws[0] + fr.throws[1] === 10 && fr.throws[0] !== 10;
        if (isStrike) S.meme = Object.assign({}, pickMeme("strike"), { sub: '🎳 STRIKE! Frame ' + (fi + 1) });
        else if (isSpare) S.meme = Object.assign({}, pickMeme("spare"), { sub: '🎳 SPARE! Frame ' + (fi + 1) });
        else { var cat = pins >= 7 ? "hype" : pins >= 4 ? "meh" : pins === 0 ? "roast" : "meh"; S.meme = pickMeme(cat); }
        if (done) {
          S.bFrame[pi]++; S.bThrow[pi] = 0;
          if (S.bFrame[pi] >= 10) {
            var allDone = true;
            for (var i = 0; i < S.players.length; i++) { if (i === pi) continue; if (S.bFrame[i] < 10) { allDone = false; break; } }
            if (allDone) {
              var best = -1, bestI = 0;
              S.players.forEach(function (p, i) { var sc = calcBowlingScores(i); var total = sc[9] || 0; if (total > best) { best = total; bestI = i; } });
              S.winner = S.players[bestI].n;
              S.meme = Object.assign({}, pickMeme("legendary"), { sub: '🏆 ' + S.winner + ' WINS with ' + best + '!', isWin: true });
            }
          }
        }
        render(); autoDissmiss(); return;
      }
      // 501 / 301
      var ns = S.scores[S.cp] - hit.sc;
      if (ns < 0 || ns === 1) { S.darts.push(hit); S.meme = Object.assign({}, pickMeme("bust"), { isBust: true }); render(); autoDissmiss(); return; }
      S.scores[S.cp] = ns; S.darts.push(hit); S.turnSc += hit.sc;
      if (ns === 0) { S.winner = S.players[S.cp].n; S.meme = Object.assign({}, pickMeme("legendary"), { sub: '🏆 ' + S.players[S.cp].n + ' WINS!', isWin: true }); }
      else S.meme = pickMeme(memeCat(hit.sc, hit.mul, hit.seg));
      render(); autoDissmiss();
    }
    function checkKillerWin() {
      var alive = S.kLives.reduce(function (a, v, i) { return v > 0 ? a.concat([i]) : a; }, []);
      if (alive.length <= 1 && alive.length > 0) { S.winner = S.players[alive[0]].n; S.meme = Object.assign({}, pickMeme("legendary"), { sub: '🏆 ' + S.winner + ' WINS!', isWin: true }); }
    }
    function autoDissmiss() { clearTimeout(window._mt); window._mt = setTimeout(dismissMeme, 4500); }
    function dismissMeme() {
      clearTimeout(window._mt);
      var wasBust = S.meme && S.meme.isBust, wasWin = S.meme && S.meme.isWin;
      S.meme = null;
      // Stop any playing audio on dismiss
      var a = document.getElementById('memeAudio');
      if (a) { a.pause(); a.currentTime = 0; }
      if (window._memeClone) { try { window._memeClone.pause(); window._memeClone = null; } catch (e) { } }
      if (wasWin) { S.phase = "over"; render(); return; }
      var g = S.gid;
      if (g === "bowling") {
        if (isBowlingGameOver(S.cp)) { S.darts = []; nextPlayer(); }
        else if (S.darts.length > 0 && isBowlingFrameDone()) { S.darts = []; }
        render(); return;
      }
      if (wasBust && S.hist.length) { var s = S.hist[S.hist.length - 1]; S.scores = s.scores; }
      if (wasBust || S.darts.length >= 3) { S.darts = []; S.turnSc = 0; S.hist = []; nextPlayer(); }
      render();
    }
    function endTurn() {
      if (S.meme) return;
      var g = S.gid;
      if (g === "bowling") {
        var pi = S.cp, fi = S.bFrame[pi];
        if (fi >= 10) return;
        while (!isBowlingFrameDone()) { S.bFrames[pi][fi].throws.push(0); S.bAllThrows[pi].push(0); }
        S.bFrame[pi]++; S.bThrow[pi] = 0; S.darts = []; S.hist = [];
        if (S.bFrame[pi] >= 10) {
          var allDone = true;
          for (var i = 0; i < S.players.length; i++) { if (S.bFrame[i] < 10) { allDone = false; break; } }
          if (allDone) {
            var best = -1, bestI = 0;
            S.players.forEach(function (p, i) { var sc = calcBowlingScores(i); var total = sc[9] || 0; if (total > best) { best = total; bestI = i; } });
            S.winner = S.players[bestI].n; S.meme = Object.assign({}, pickMeme("legendary"), { sub: '🏆 ' + S.winner + ' WINS with ' + best + '!', isWin: true });
            render(); autoDissmiss(); return;
          }
        }
        nextPlayer(); render(); return;
      }
      S.darts = []; S.turnSc = 0; S.hist = []; nextPlayer(); render();
    }
    function undo() {
      if (S.meme || !S.hist.length) return;
      var prev = S.hist.pop();
      restore(prev);
      S.darts.pop();
      render();
    }
    function nextPlayer() {
      if (S.gid === "killer") { var n = (S.cp + 1) % S.players.length; for (var i = 0; i < S.players.length; i++) { if (S.kLives[n] > 0) break; n = (n + 1) % S.players.length; } S.cp = n; }
      else if (S.gid === "bowling") {
        var n = (S.cp + 1) % S.players.length;
        for (var i = 0; i < S.players.length; i++) { if (S.bFrame[n] < 10) break; n = (n + 1) % S.players.length; }
        S.cp = n;
      }
      else S.cp = (S.cp + 1) % S.players.length;
    }
    render();
